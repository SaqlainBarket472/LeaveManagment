<div class="container py-4">
  <div class="card shadow-sm rounded-4">
    <div class="card-body">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
        <div>
          <h2 class="mb-1">Leave Types Management</h2>
          <p class="text-muted mb-0">Create and edit leave types for HR with an accrual toggle and default balance.</p>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card p-3 border-secondary-subtle">
            <h5 class="mb-3">Leave type form</h5>

            <div class="mb-3">
              <label class="form-label">Name</label>
              <input class="form-control" [(ngModel)]="formModel.name" name="typeName" />
            </div>

            <div class="mb-3">
              <label class="form-label">Default balance</label>
              <input class="form-control" type="number" [(ngModel)]="formModel.defaultBalance" name="defaultBalance" />
            </div>

            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="isAccrued" [(ngModel)]="formModel.isAccrued" name="isAccrued" />
              <label class="form-check-label" for="isAccrued">Is accrued</label>
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-primary" (click)="saveLeaveType()">{{ editMode ? 'Update type' : 'Add type' }}</button>
              <button class="btn btn-outline-secondary" type="button" (click)="resetForm()">Clear</button>
            </div>

            <div *ngIf="feedback" class="mt-3 alert alert-info py-2">{{ feedback }}</div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card p-3 border-secondary-subtle">
            <h5 class="mb-3">Leave types list</h5>
            <div class="table-responsive">
              <table class="table table-sm table-hover mb-0">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Balance</th>
                    <th>Accrued</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let type of leaveTypes">
                    <td>{{ type.name }}</td>
                    <td>{{ type.defaultBalance }}</td>
                    <td>{{ type.isAccrued ? 'Yes' : 'No' }}</td>
                    <td class="text-end">
                      <button class="btn btn-sm btn-outline-primary me-2" (click)="editLeaveType(type)">Edit</button>
                      <button class="btn btn-sm btn-outline-danger" (click)="deleteLeaveType(type.id)">Delete</button>
                    </td>
                  </tr>
                  <tr *ngIf="leaveTypes.length === 0">
                    <td colspan="4" class="text-center text-muted py-4">No leave types configured yet.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
