<div class="container">

  <!-- HEADER -->
  <h2 class="mb-3">Leave Approval Panel</h2>

  <!-- SEARCH -->
  <div class="mb-2">
    <input type="text"
           [(ngModel)]="searchText"
           placeholder="Search employee / leave type..."
           class="form-control">
  </div>

  <!-- BULK ACTIONS -->
  <div class="mb-3">

    <button class="btn btn-success me-2"
            (click)="approveSelected()">
      Approve Selected
    </button>

    <button class="btn btn-danger me-2"
            (click)="rejectSelected()">
      Reject Selected
    </button>

    <input type="text"
           [(ngModel)]="bulkRejectComment"
           class="form-control mt-2"
           placeholder="Bulk reject comment">
  </div>

  <!-- TABLE -->
  <div class="table-responsive">
    <table class="table table-bordered table-hover">

      <thead class="table-dark">
        <tr>

          <!-- SELECT ALL -->
          <th>
            <input type="checkbox"
                   (change)="toggleSelectAll($event.target.checked)">
          </th>

          <th>Employee Name</th>
          <th>Leave Type</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Status</th>
          <th>Rejection Comment</th>
          <th>Actions</th>

        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let r of requests">

          <!-- SELECT -->
          <td>
            <input type="checkbox"
                   (change)="toggleSelection(r.id, $event.target.checked)">
          </td>

          <!-- EMPLOYEE -->
          <td>{{ r.employeeName }}</td>

          <!-- TYPE -->
          <td>{{ r.leaveTypeId }}</td>

          <!-- DATES -->
          <td>{{ r.startDate | date:'shortDate' }}</td>
          <td>{{ r.endDate | date:'shortDate' }}</td>

          <!-- STATUS -->
          <td>
            <span [ngClass]="getStatusLabel(r.status)">
              {{ getStatusLabel(r.status) }}
            </span>
          </td>

          <!-- COMMENT -->
          <td>
            <input type="text"
                   class="form-control"
                   [(ngModel)]="comments[r.id]"
                   placeholder="Reason (if rejecting)">
          </td>

          <!-- ACTIONS -->
          <td>

            <button class="btn btn-sm btn-success me-1"
                    (click)="approve(r.id)">
              Approve
            </button>

            <button class="btn btn-sm btn-danger"
                    (click)="reject(r.id)">
              Reject
            </button>

          </td>

        </tr>

      </tbody>

    </table>
  </div>

</div>
